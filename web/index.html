<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="MYCOSIX MUSHROOMS — Fresh oyster mushrooms grown differently by six students. Farm-fresh, naturally good. Order on WhatsApp for delivery.">
  <meta name="theme-color" content="#4A5D44">
  <meta name="color-scheme" content="light">
  <meta property="og:title" content="MYCOSIX MUSHROOMS — Grown Different">
  <meta property="og:description" content="Fresh oyster mushrooms. Fresh by Us. Naturally Good.">
  <meta property="og:type" content="website">

  <title>MYCOSIX MUSHROOMS — Grown Different</title>

  <!-- Fonts: Fraunces + Manrope are bundled with the app (see pubspec.yaml);
       no external font request leaves the device. -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MYCOSIX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- First paint. Inlined (the CSP allows inline styles) so the very first
       frame the browser draws is already the brand cream. While this lived in
       an external file the page showed the browser's own white - or near-black
       in dark mode - canvas for as long as that request took, and then jumped;
       that jump is the flash on open. The colour is MxColors.cream (#F2ECDF),
       the app's own page background, and manifest.json carries the same value,
       so the OS launch screen, the splash and the loaded app are one
       continuous surface. -->
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; padding: 0; background: #F2ECDF; }
    #mx-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #F2ECDF;
      color: #2E332D;
      font-family: 'Manrope', system-ui, sans-serif;
      text-align: center;
      z-index: 9999;
      transition: opacity 0.45s ease;
    }
    #mx-boot .mark {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #4A5D44;
    }
    #mx-boot .sub {
      font-size: 12px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #8A7D6C;
    }
    #mx-boot .bar {
      width: 132px;
      height: 2px;
      background: #E4DCCB;
      overflow: hidden;
    }
    #mx-boot .bar i {
      display: block;
      width: 42%;
      height: 100%;
      background: #4A5D44;
      animation: mxboot 1.1s ease-in-out infinite;
    }
    @keyframes mxboot {
      0% { transform: translateX(-110%); }
      55% { transform: translateX(160%); }
      100% { transform: translateX(260%); }
    }
    #mx-boot.done { opacity: 0; pointer-events: none; }

    /* Flutter's own engine elements. The app paints every pixel of these, so
       they are transparent in normal use - but "transparent" leaves the
       browser's default white showing for the instants when the engine has a
       view and has not painted into it yet (which is exactly the moment the
       splash hands over). Giving them the page colour as well means every
       layer of the stack is cream from the first paint, so there is no white
       left anywhere for a flash to come from. */
    flutter-view,
    flt-glass-pane,
    flt-scene-host {
      background: #F2ECDF;
    }
  </style>

  <!-- Open the connections the app is about to need while the app itself is
       still downloading, so no request waits on a handshake. www.gstatic.com
       serves the graphics engine; the two googleapis hosts are the database
       and the sign-in. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">

  <!-- Splash hand-off. This listener has to be in place before the engine can
       reach its first frame: flutter_bootstrap.js is an async script, so on a
       warm cache it can run before the parser reaches a <script> further down
       the page - which would leave the splash on screen for good. Registering
       it here, ahead of everything, removes that race. -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('mx-boot');
      if (el) { el.classList.add('done'); }
      setTimeout(function () {
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }, 600);
    });
  </script>

</head>
<body>
  <div id="mx-boot" role="status" aria-label="Loading MYCOSIX MUSHROOMS">
    <div class="mark">MYCOSIX</div>
    <div class="sub">Mushrooms</div>
    <div class="bar"><i></i></div>
  </div>

  <script src="mx-always-fresh.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
